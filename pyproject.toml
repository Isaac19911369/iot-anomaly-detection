[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-anomaly"
version = "0.1.0"
description = "Deep-learning anomaly detection for multivariate IoT sensor streams — benchmark, training and serving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eshagh Dehmollaian" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "psycopg[binary]>=3.1"]
tracking = ["mlflow-skinny>=2.12"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "fastapi>=0.110"]

[project.scripts]
iot-anomaly = "iot_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["iot_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
